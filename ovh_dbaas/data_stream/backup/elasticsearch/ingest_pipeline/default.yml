---
description: Pipeline for processing OVH Database as a Service backup state events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only (Agentless metadata and error-only documents) ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  # --- end CEL-only ---

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy
        of the original message. The `event.original` field is not touched if the
        document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
  - set:
      field: error.message
      tag: extract_cel_error_message
      copy_from: json.error.message
      if: ctx.json?.error?.message != null
      ignore_empty_value: true
  - set:
      field: error.code
      tag: extract_cel_error_code
      copy_from: json.error.code
      if: ctx.json?.error?.code != null
      ignore_empty_value: true
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.event?.original != null
      description: CEL data collection error — terminates without indexing.

  # --- Timestamp normalization ---
  - date:
      field: json.createdAt
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_created_at_to_timestamp
      if: ctx.json?.createdAt != null

  # --- ECS field mapping ---
  - rename:
      field: json.engine
      target_field: service.type
      tag: rename_engine_to_service_type
      ignore_missing: true
  - rename:
      field: json.clusterId
      target_field: service.id
      tag: rename_cluster_id_to_service_id
      ignore_missing: true

  # --- ECS categorization ---
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category_configuration
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # --- Custom OVH DBaaS backup fields ---
  - rename:
      field: json.id
      target_field: ovh_dbaas.backup.id
      tag: rename_id
      ignore_missing: true
  - rename:
      field: json.createdAt
      target_field: ovh_dbaas.backup.created_at
      tag: rename_created_at
      ignore_missing: true
  - rename:
      field: json.description
      target_field: ovh_dbaas.backup.description
      tag: rename_description
      ignore_missing: true
  - rename:
      field: json.status
      target_field: ovh_dbaas.backup.status
      tag: rename_status
      ignore_missing: true
  - rename:
      field: json.type
      target_field: ovh_dbaas.backup.type
      tag: rename_type
      ignore_missing: true
  - rename:
      field: json.size.value
      target_field: ovh_dbaas.backup.size.value
      tag: rename_size_value
      ignore_missing: true
  - rename:
      field: json.size.unit
      target_field: ovh_dbaas.backup.size.unit
      tag: rename_size_unit
      ignore_missing: true

  # --- Regions: extract name strings from region object array ---
  - script:
      lang: painless
      tag: extract_region_names
      description: Extract region name strings from regions array of objects into a flat keyword array.
      if: ctx.json?.regions instanceof List && ctx.json.regions.size() > 0
      source: |-
        def names = new ArrayList();
        for (def r : ctx.json.regions) {
          if (r != null && r.containsKey('name') && r.name != null) {
            names.add(r.name);
          }
        }
        if (names.size() > 0) {
          if (!ctx.containsKey('ovh_dbaas')) ctx.ovh_dbaas = new HashMap();
          if (!ctx.ovh_dbaas.containsKey('backup')) ctx.ovh_dbaas.backup = new HashMap();
          ctx.ovh_dbaas.backup.regions = names;
        }

  # --- Cleanup ---
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
