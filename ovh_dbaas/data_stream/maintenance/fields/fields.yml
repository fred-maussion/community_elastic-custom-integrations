- name: ovh_dbaas.maintenance
  type: group
  fields:
    - name: id
      type: keyword
      description: Maintenance window UUID.
    - name: description
      type: keyword
      description: Human-readable description of the maintenance (e.g. "Minor version upgrade from 14.9 to 14.11").
    - name: status
      type: keyword
      description: Current maintenance status (e.g. SCHEDULED, APPLYING, APPLIED, ERROR).
    - name: scheduled_at
      type: date
      description: Planned execution time of the maintenance window.
    - name: applied_at
      type: date
      description: Actual time the maintenance was applied. Null until the maintenance is completed.
