version: "2.3"
services:
  ovh-ai-ml-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: ovh-ai-ml-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: "8090"
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-ai-ml.yml
