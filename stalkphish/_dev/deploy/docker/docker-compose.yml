services:
  stalkphish-phishing:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: stalkphish-phishing
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-phishing.yml
