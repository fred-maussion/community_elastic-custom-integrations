- name: ovh_network_security.firewall
  type: group
  fields:
    - name: ip_block
      type: keyword
      description: The CIDR block that owns the firewall.
    - name: ip_on_firewall
      type: ip
      description: The IPv4 address that has the firewall enabled.
    - name: sequence
      type: integer
      description: Rule priority sequence number (0 = highest priority, max 19).
    - name: action
      type: keyword
      description: Rule action (deny or permit).
    - name: protocol
      type: keyword
      description: Protocol matched by the rule (ah, esp, gre, icmp, ipv4, tcp, udp).
    - name: source
      type: keyword
      description: Source IP or CIDR filter (nullable).
    - name: destination
      type: keyword
      description: Destination IP or CIDR filter (nullable).
    - name: source_port
      type: keyword
      description: Source port filter, TCP/UDP only (nullable).
    - name: destination_port
      type: keyword
      description: Destination port filter, TCP/UDP only (nullable).
    - name: tcp_option
      type: keyword
      description: TCP option filter (syn or established, nullable).
    - name: fragments
      type: boolean
      description: Whether to match fragmented packets (nullable).
    - name: l3_packet_length
      type: keyword
      description: L3 packet length filter (nullable).
    - name: rule
      type: keyword
      description: Rule identifier string.
    - name: creation_date
      type: date
      description: Timestamp when the rule was created.
    - name: state
      type: keyword
      description: Rule provisioning state (creationPending, ok, removalPending).
