---
description: Pipeline for processing OVH Network Security mitigation events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # CEL-only: remove Agentless metadata fields that can collide with ECS
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  # JSE00001: rename message to event.original
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy of
        the original message. The `event.original` field is not touched if the document
        already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # Parse JSON payload
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'

  # Map ipOnMitigation to destination.ip (ECS) and custom field
  - rename:
      field: json.ipOnMitigation
      target_field: destination.ip
      ignore_missing: true
      tag: rename_ip_on_mitigation_to_destination_ip
  - set:
      field: ovh_network_security.mitigation.ip_on_mitigation
      tag: set_ip_on_mitigation
      copy_from: destination.ip
      if: ctx.destination?.ip != null

  # Map ip_block, state, auto, permanent to custom fields
  - rename:
      field: json.ip_block
      target_field: ovh_network_security.mitigation.ip_block
      ignore_missing: true
      tag: rename_ip_block
  - rename:
      field: json.state
      target_field: ovh_network_security.mitigation.state
      ignore_missing: true
      tag: rename_state
  - set:
      field: event.action
      tag: set_event_action
      copy_from: ovh_network_security.mitigation.state
      if: ctx.ovh_network_security?.mitigation?.state != null
  - rename:
      field: json.auto
      target_field: ovh_network_security.mitigation.auto
      ignore_missing: true
      tag: rename_auto
  - rename:
      field: json.permanent
      target_field: ovh_network_security.mitigation.permanent
      ignore_missing: true
      tag: rename_permanent

  # ECS categorization
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category_network
      value: network
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # IP enrichment: geo and ASN for destination.ip
  - geoip:
      field: destination.ip
      target_field: destination.geo
      ignore_missing: true
      tag: enrich_destination_geo
      if: ctx.destination?.ip != null
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: destination.ip
      target_field: destination.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: enrich_destination_asn
      if: ctx.destination?.ip != null
  - rename:
      field: destination.as.asn
      target_field: destination.as.number
      ignore_missing: true
      tag: rename_destination_asn
  - rename:
      field: destination.as.organization_name
      target_field: destination.as.organization.name
      ignore_missing: true
      tag: rename_destination_as_org

  # related.ip
  - append:
      field: related.ip
      tag: append_destination_ip_to_related
      value: '{{{destination.ip}}}'
      allow_duplicates: false
      if: ctx.destination?.ip != null

  # Cleanup temporary fields
  - remove:
      field: json
      ignore_missing: true
      tag: cleanup_json

  # Tag document for review when a collector error was present
  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
