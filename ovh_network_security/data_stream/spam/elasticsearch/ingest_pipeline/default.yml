---
description: Pipeline for processing OVH Network Security spam events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # CEL/Agentless metadata removal
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.

  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  # JSE00001
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # JSON parsing
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            value: '{{{_ingest.on_failure_message}}}'

  # ipSpamming → source.ip (primary ECS field) + custom copy
  - rename:
      field: json.ipSpamming
      target_field: source.ip
      ignore_missing: true
      tag: rename_ip_spamming_to_source_ip

  - set:
      field: ovh_network_security.spam.ip_spamming
      copy_from: source.ip
      tag: set_spam_ip_spamming
      if: ctx.source?.ip != null

  # ip_block → custom field
  - rename:
      field: json.ip_block
      target_field: ovh_network_security.spam.ip_block
      ignore_missing: true
      tag: rename_ip_block

  # state → custom field + event.action
  - rename:
      field: json.state
      target_field: ovh_network_security.spam.state
      ignore_missing: true
      tag: rename_state

  - set:
      field: event.action
      copy_from: ovh_network_security.spam.state
      tag: set_event_action
      if: ctx.ovh_network_security?.spam?.state != null

  # date → custom date field (kept as-is), then parsed into @timestamp
  - rename:
      field: json.date
      target_field: ovh_network_security.spam.date
      ignore_missing: true
      tag: rename_date

  - date:
      field: ovh_network_security.spam.date
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_timestamp
      if: ctx.ovh_network_security?.spam?.date != null

  # time → custom field
  - rename:
      field: json.time
      target_field: ovh_network_security.spam.time
      ignore_missing: true
      tag: rename_time

  # GeoIP geolocation enrichment on source.ip
  - geoip:
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      tag: enrich_source_geo
      if: ctx.source?.ip != null

  # ASN enrichment on source.ip
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      tag: enrich_source_asn
      if: ctx.source?.ip != null

  - rename:
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
      tag: rename_source_asn

  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      tag: rename_source_as_org

  # ECS categorization
  - set:
      field: event.kind
      tag: set_event_kind
      value: event

  - append:
      field: event.category
      tag: append_event_category_network
      value: network
      allow_duplicates: false

  - append:
      field: event.category
      tag: append_event_category_email
      value: email
      allow_duplicates: false

  - append:
      field: event.type
      tag: append_event_type_denied
      value: denied
      allow_duplicates: false

  # related.ip — append source.ip; skip ip_block since it is a CIDR (contains '/')
  - append:
      field: related.ip
      tag: append_source_ip_to_related
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null

  # Cleanup
  - remove:
      field: json
      ignore_missing: true
      tag: cleanup_json

  - append:
      field: tags
      tag: append_preserve_on_collector_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
