title: "OVHcloud IAM Tokens"
type: logs
streams:
  - input: cel
    title: OVHcloud IAM personal access tokens
    description: Collect personal access token state from OVHcloud IAM users.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Collection Interval
        description: How often to poll the API for IAM tokens (e.g. 5m, 15m, 1h).
        default: 15m
        show_user: true
        required: true
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracing
        description: Enables request tracing for the CEL input. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details. This is meant for debugging only and should be disabled in production.
        multi: false
        required: false
        show_user: false
      - name: proxy_url
        type: text
        title: Proxy URL
        multi: false
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL Configuration
        multi: false
        required: false
        show_user: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out (e.g. 60s).
        multi: false
        required: false
        show_user: false
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - ovh_iam-token
