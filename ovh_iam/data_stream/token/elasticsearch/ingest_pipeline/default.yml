---
description: Pipeline for processing OVHcloud IAM personal access token state events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_json: {{{ _ingest.on_failure_message }}}'

  # @timestamp: use lastUsed if present, otherwise creation
  - date:
      field: json.lastUsed
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_last_used_timestamp
      if: ctx.json?.lastUsed != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_last_used_timestamp: {{{ _ingest.on_failure_message }}}'
  - date:
      field: json.creation
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_creation_timestamp_fallback
      if: ctx.json?.lastUsed == null && ctx.json?.creation != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_creation_timestamp_fallback: {{{ _ingest.on_failure_message }}}'

  # event.created from creation timestamp
  - date:
      field: json.creation
      target_field: event.created
      formats:
        - ISO8601
      tag: parse_creation
      if: ctx.json?.creation != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_creation: {{{ _ingest.on_failure_message }}}'

  # ECS user field from user_login added by CEL
  - rename:
      field: json.user_login
      target_field: user.name
      tag: rename_user_login
      ignore_missing: true

  # OVH-specific token fields
  - rename:
      field: json.name
      target_field: ovh.iam.token.name
      tag: rename_token_name
      ignore_missing: true
  - rename:
      field: json.description
      target_field: ovh.iam.token.description
      tag: rename_token_description
      ignore_missing: true
  - date:
      field: json.expiresAt
      target_field: ovh.iam.token.expires_at
      formats:
        - ISO8601
      tag: parse_expires_at
      if: ctx.json?.expiresAt != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_expires_at: {{{ _ingest.on_failure_message }}}'
  - date:
      field: json.lastUsed
      target_field: ovh.iam.token.last_used
      formats:
        - ISO8601
      tag: parse_last_used
      if: ctx.json?.lastUsed != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_last_used: {{{ _ingest.on_failure_message }}}'

  # Static cloud fields
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovh

  # ECS event categorization
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category_iam
      value: iam
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # Cleanup
  - remove:
      field: json
      tag: cleanup_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
