services:
  ovh-iam-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: ovh-iam-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-iam.yml
