version: "2.3"
services:
  ovh_load_balancer-haproxy:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: ovh_load_balancer-haproxy
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: "8090"
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-haproxy.yml
