rules:
  # OAuth2 token endpoint — returns a test access token
  - path: /auth/oauth2/token
    methods: [POST]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - "application/json"
        body: '{"access_token":"test-token","token_type":"Bearer","expires_in":3600,"scope":"all"}'
  # Page 3 — terminal page (no X-Pagination-Cursor-Next header); must be before the catch-all
  - path: /v2/publicCloud/project/aaaabbbb-cccc-dddd-eeee-ffffaaaabbbb/compute/instance
    methods: [GET]
    request_headers:
      X-Pagination-Size:
        - "100"
      X-Pagination-Cursor:
        - "cursor-page-3"
