wait_for_data_timeout: 1m
input: cel
service: ovh-rancher-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  service_name: test-project-id
  rancher_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  client_id: xxxx
  client_secret: xxxx
  token_url: http://{{Hostname}}:{{Port}}/auth/oauth2/token
data_stream:
  vars:
    interval: 2s
    preserve_original_event: true
assert:
  # Round 1: 2 tasks from page 1 + 1 task from page 2 = 3 tasks (all pass empty cursor)
  # Round 2: 1 new task (updatedAt 2025-08-26T09:00:00Z > cursor 2025-08-25T14:32:01Z) = 1 task
  hit_count: 4
