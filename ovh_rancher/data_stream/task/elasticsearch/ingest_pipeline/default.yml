---
description: Pipeline for processing OVH Managed Rancher Service task events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only (Agentless metadata and error-only documents) ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  # --- end CEL-only ---

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the
        original message. The `event.original` field is not touched if the document already
        has one; it may happen when Logstash sends the document.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required if the document has an `event.original` field.

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null

  # --- Timestamp normalization ---
  - date:
      field: json.updatedAt
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_updated_at_to_timestamp
      if: ctx.json?.updatedAt != null
  - date:
      field: json.createdAt
      target_field: event.start
      formats:
        - ISO8601
      tag: parse_created_at_to_event_start
      if: ctx.json?.createdAt != null
  - date:
      field: json.finishedAt
      target_field: event.end
      formats:
        - ISO8601
      tag: parse_finished_at_to_event_end
      if: ctx.json?.finishedAt != null

  # --- ECS cloud fields ---
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovhcloud
  - set:
      field: cloud.service.name
      tag: set_cloud_service_name
      value: managed-rancher-service

  # --- ECS categorization ---
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: set_event_category
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: set_event_type
      value: change
      allow_duplicates: false

  # Pattern B: event.outcome from status (4 values → 3 outcomes)
  - set:
      field: event.outcome
      tag: set_event_outcome_success
      value: success
      if: ctx.json?.status == 'DONE'
  - set:
      field: event.outcome
      tag: set_event_outcome_failure
      value: failure
      if: ctx.json?.status == 'ERROR'
  - set:
      field: event.outcome
      tag: set_event_outcome_unknown
      value: unknown
      if: ctx.json?.status == 'DOING' || ctx.json?.status == 'TODO'

  # --- event.action: lowercase + replace _ with - ---
  - set:
      field: event.action
      tag: set_event_action
      copy_from: json.type
      if: ctx.json?.type != null
  - lowercase:
      field: event.action
      tag: lowercase_event_action
      ignore_missing: true
  - gsub:
      field: event.action
      tag: gsub_event_action_underscores
      pattern: '_'
      replacement: '-'
      ignore_missing: true

  # --- Vendor field mapping ---
  - rename:
      field: json.id
      target_field: ovh_rancher.task.id
      tag: rename_task_id
      ignore_missing: true
  - date:
      field: json.createdAt
      target_field: ovh_rancher.task.created_at
      formats:
        - ISO8601
      tag: parse_created_at_to_vendor
      if: ctx.json?.createdAt != null
  - date:
      field: json.updatedAt
      target_field: ovh_rancher.task.updated_at
      formats:
        - ISO8601
      tag: parse_updated_at_to_vendor
      if: ctx.json?.updatedAt != null
  - date:
      field: json.finishedAt
      target_field: ovh_rancher.task.finished_at
      formats:
        - ISO8601
      tag: parse_finished_at_to_vendor
      if: ctx.json?.finishedAt != null
  - rename:
      field: json.type
      target_field: ovh_rancher.task.type
      tag: rename_task_type
      ignore_missing: true
  - rename:
      field: json.status
      target_field: ovh_rancher.task.status
      tag: rename_task_status
      ignore_missing: true
  - rename:
      field: json.message
      target_field: ovh_rancher.task.message
      tag: rename_task_message
      ignore_missing: true
  - rename:
      field: json.progress
      target_field: ovh_rancher.task.progress
      tag: rename_task_progress
      ignore_missing: true
  - rename:
      field: json.currentStep
      target_field: ovh_rancher.task.current_step
      tag: rename_task_current_step
      ignore_missing: true
  - foreach:
      field: json.steps
      processor:
        rename:
          field: _ingest._value.startedAt
          target_field: _ingest._value.started_at
          ignore_missing: true
      tag: transform_steps_started_at
      ignore_missing: true
  - foreach:
      field: json.steps
      processor:
        rename:
          field: _ingest._value.finishedAt
          target_field: _ingest._value.finished_at
          ignore_missing: true
      tag: transform_steps_finished_at
      ignore_missing: true
  - rename:
      field: json.steps
      target_field: ovh_rancher.task.steps
      tag: rename_task_steps
      ignore_missing: true
  - rename:
      field: json.errors
      target_field: ovh_rancher.task.errors
      tag: rename_task_errors
      ignore_missing: true

  # --- Cleanup ---
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
