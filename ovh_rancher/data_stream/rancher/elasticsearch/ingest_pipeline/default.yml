---
description: Pipeline for processing OVH Managed Rancher Service state events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only (Agentless metadata and error-only documents) ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  # --- end CEL-only ---

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
      description: >-
        Renames the original `message` field to `event.original` to store a copy
        of the original message. The `event.original` field is not touched if the
        document already has one; it may happen when Logstash sends the document.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required if the document has an `event.original` field.

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null

  # --- Timestamp normalization ---
  - date:
      field: json.updatedAt
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_updated_at_to_timestamp
      if: ctx.json?.updatedAt != null
  - date:
      field: json.createdAt
      target_field: event.start
      formats:
        - ISO8601
      tag: parse_created_at_to_event_start
      if: ctx.json?.createdAt != null

  # --- ECS cloud fields ---
  - rename:
      field: json.currentState.region
      target_field: ovh_rancher.rancher.current_state.region
      tag: rename_current_state_region
      ignore_missing: true
  - set:
      field: cloud.region
      tag: set_cloud_region
      copy_from: ovh_rancher.rancher.current_state.region
      if: ctx.ovh_rancher?.rancher?.current_state?.region != null
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovhcloud
  - set:
      field: cloud.service.name
      tag: set_cloud_service_name
      value: managed-rancher-service

  # --- ECS categorization ---
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: set_event_category
      value: host
      allow_duplicates: false
  - append:
      field: event.type
      tag: set_event_type
      value: info
      allow_duplicates: false

  # --- Vendor field mapping: top-level ---
  - rename:
      field: json.id
      target_field: ovh_rancher.rancher.id
      tag: rename_rancher_id
      ignore_missing: true
  - date:
      field: json.createdAt
      target_field: ovh_rancher.rancher.created_at
      formats:
        - ISO8601
      tag: parse_created_at_to_vendor
      if: ctx.json?.createdAt != null
  - date:
      field: json.updatedAt
      target_field: ovh_rancher.rancher.updated_at
      formats:
        - ISO8601
      tag: parse_updated_at_to_vendor
      if: ctx.json?.updatedAt != null
  - rename:
      field: json.resourceStatus
      target_field: ovh_rancher.rancher.resource_status
      tag: rename_resource_status
      ignore_missing: true

  # --- Vendor field mapping: currentState ---
  - rename:
      field: json.currentState.name
      target_field: ovh_rancher.rancher.current_state.name
      tag: rename_current_state_name
      ignore_missing: true
  - rename:
      field: json.currentState.plan
      target_field: ovh_rancher.rancher.current_state.plan
      tag: rename_current_state_plan
      ignore_missing: true
  - rename:
      field: json.currentState.version
      target_field: ovh_rancher.rancher.current_state.version
      tag: rename_current_state_version
      ignore_missing: true
  - rename:
      field: json.currentState.url
      target_field: ovh_rancher.rancher.current_state.url
      tag: rename_current_state_url
      ignore_missing: true
  - rename:
      field: json.currentState.iamAuthEnabled
      target_field: ovh_rancher.rancher.current_state.iam_auth_enabled
      tag: rename_current_state_iam_auth_enabled
      ignore_missing: true
  - foreach:
      field: json.currentState.ipRestrictions
      processor:
        rename:
          field: _ingest._value.cidrBlock
          target_field: _ingest._value.cidr_block
          ignore_missing: true
      tag: transform_current_state_ip_restrictions_keys
      ignore_missing: true
  - rename:
      field: json.currentState.ipRestrictions
      target_field: ovh_rancher.rancher.current_state.ip_restrictions
      tag: rename_current_state_ip_restrictions
      ignore_missing: true
  - rename:
      field: json.currentState.networking.egressCidrBlocks
      target_field: ovh_rancher.rancher.current_state.networking.egress_cidr_blocks
      tag: rename_current_state_networking_egress_cidr_blocks
      ignore_missing: true
  - date:
      field: json.currentState.usage.datetime
      target_field: ovh_rancher.rancher.current_state.usage.datetime
      formats:
        - ISO8601
      tag: parse_usage_datetime
      if: ctx.json?.currentState?.usage?.datetime != null
  - rename:
      field: json.currentState.usage.orchestratedVcpus
      target_field: ovh_rancher.rancher.current_state.usage.orchestrated_vcpus
      tag: rename_usage_orchestrated_vcpus
      ignore_missing: true

  # --- Vendor field mapping: targetSpec ---
  - rename:
      field: json.targetSpec.name
      target_field: ovh_rancher.rancher.target_spec.name
      tag: rename_target_spec_name
      ignore_missing: true
  - rename:
      field: json.targetSpec.plan
      target_field: ovh_rancher.rancher.target_spec.plan
      tag: rename_target_spec_plan
      ignore_missing: true
  - rename:
      field: json.targetSpec.version
      target_field: ovh_rancher.rancher.target_spec.version
      tag: rename_target_spec_version
      ignore_missing: true
  - rename:
      field: json.targetSpec.iamAuthEnabled
      target_field: ovh_rancher.rancher.target_spec.iam_auth_enabled
      tag: rename_target_spec_iam_auth_enabled
      ignore_missing: true
  - foreach:
      field: json.targetSpec.ipRestrictions
      processor:
        rename:
          field: _ingest._value.cidrBlock
          target_field: _ingest._value.cidr_block
          ignore_missing: true
      tag: transform_target_spec_ip_restrictions_keys
      ignore_missing: true
  - rename:
      field: json.targetSpec.ipRestrictions
      target_field: ovh_rancher.rancher.target_spec.ip_restrictions
      tag: rename_target_spec_ip_restrictions
      ignore_missing: true

  # --- Vendor field mapping: currentTasks ---
  - rename:
      field: json.currentTasks
      target_field: ovh_rancher.rancher.current_tasks
      tag: rename_current_tasks
      ignore_missing: true

  # --- Cleanup ---
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
