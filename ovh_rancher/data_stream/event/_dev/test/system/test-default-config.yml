wait_for_data_timeout: 1m
input: cel
service: ovh-rancher-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  service_name: test-project-id
  rancher_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  client_id: xxxx
  client_secret: xxxx
  token_url: http://{{Hostname}}:{{Port}}/auth/oauth2/token
data_stream:
  vars:
    interval: 2s
    preserve_original_event: true
assert:
  # Round 1: 2 events from page 1 + 1 from page 2 = 3 events (all pass empty cursor)
  # Round 2: 1 new event (createdAt 2025-08-26 > cursor 2025-08-25T12:00:00Z) = 1 event
  hit_count: 4
