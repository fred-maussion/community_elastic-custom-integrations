title: OVHcloud Managed Rancher Service Events
type: logs
streams:
  - input: cel
    title: OVHcloud Managed Rancher Service event log
    description: Collect events from an OVHcloud Managed Rancher Service instance via the OVHcloud v2 REST API.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Collection Interval
        description: How often to poll the API for Rancher events (e.g. 1m, 5m).
        required: true
        show_user: true
        default: 1m
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Default is 30s.
        required: false
        show_user: false
        default: 30s
      - name: proxy_url
        type: text
        title: Proxy URL
        description: URL of the HTTP proxy to use for API requests.
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL Configuration
        description: SSL/TLS configuration for API requests.
        required: false
        show_user: false
        multi: false
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracer
        description: >-
          The request tracer logs HTTP requests and responses for debugging. Enabling this compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
      - name: preserve_original_event
        type: bool
        title: Preserve Original Event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: Processors to apply to events before indexing.
        required: false
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false
