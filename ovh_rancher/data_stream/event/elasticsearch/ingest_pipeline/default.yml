---
description: Pipeline for processing OVH Managed Rancher Service event log events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only (Agentless metadata and error-only documents) ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  # --- end CEL-only ---

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the
        original message. The `event.original` field is not touched if the document already
        has one; it may happen when Logstash sends the document.
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required if the document has an `event.original` field.

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null

  # --- Timestamp normalization ---
  - date:
      field: json.createdAt
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_created_at_to_timestamp
      if: ctx.json?.createdAt != null

  # --- ECS cloud fields ---
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovhcloud
  - set:
      field: cloud.service.name
      tag: set_cloud_service_name
      value: managed-rancher-service

  # --- ECS categorization ---
  - set:
      field: event.kind
      tag: set_event_kind
      value: event

  # Pattern B: 4 event types — append processors with conditionals
  - append:
      field: event.category
      tag: set_event_category_cluster_created
      value: configuration
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_CLUSTER_CREATED'
  - append:
      field: event.type
      tag: set_event_type_cluster_created
      value: creation
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_CLUSTER_CREATED'
  - append:
      field: event.category
      tag: set_event_category_cluster_deleted
      value: configuration
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_CLUSTER_DELETED'
  - append:
      field: event.type
      tag: set_event_type_cluster_deleted
      value: deletion
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_CLUSTER_DELETED'
  - append:
      field: event.category
      tag: set_event_category_service_upgraded
      value: configuration
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_SERVICE_UPGRADED'
  - append:
      field: event.type
      tag: set_event_type_service_upgraded
      value: change
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_SERVICE_UPGRADED'
  - append:
      field: event.category
      tag: set_event_category_admin_requested
      value: iam
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_ADMIN_REQUESTED'
  - append:
      field: event.type
      tag: set_event_type_admin_requested
      value: change
      allow_duplicates: false
      if: ctx.json?.type == 'RANCHER_ADMIN_REQUESTED'
  # Fallback for any unrecognised event type
  - append:
      field: event.category
      tag: set_event_category_default
      value: configuration
      allow_duplicates: false
      if: >-
        ctx.json?.type != null &&
        !['RANCHER_CLUSTER_CREATED','RANCHER_CLUSTER_DELETED','RANCHER_SERVICE_UPGRADED','RANCHER_ADMIN_REQUESTED'].contains(ctx.json.type)
  - append:
      field: event.type
      tag: set_event_type_default
      value: info
      allow_duplicates: false
      if: >-
        ctx.json?.type != null &&
        !['RANCHER_CLUSTER_CREATED','RANCHER_CLUSTER_DELETED','RANCHER_SERVICE_UPGRADED','RANCHER_ADMIN_REQUESTED'].contains(ctx.json.type)

  # --- event.action: lowercase + replace _ with - ---
  - set:
      field: event.action
      tag: set_event_action
      copy_from: json.type
      if: ctx.json?.type != null
  - lowercase:
      field: event.action
      tag: lowercase_event_action
      ignore_missing: true
  - gsub:
      field: event.action
      tag: gsub_event_action_underscores
      pattern: '_'
      replacement: '-'
      ignore_missing: true

  # --- Vendor field mapping ---
  - rename:
      field: json.id
      target_field: ovh_rancher.event.id
      tag: rename_event_id
      ignore_missing: true
  - date:
      field: json.createdAt
      target_field: ovh_rancher.event.created_at
      formats:
        - ISO8601
      tag: parse_created_at_to_vendor
      if: ctx.json?.createdAt != null
  - rename:
      field: json.rancherId
      target_field: ovh_rancher.event.rancher_id
      tag: rename_rancher_id
      ignore_missing: true
  - rename:
      field: json.type
      target_field: ovh_rancher.event.type
      tag: rename_event_type
      ignore_missing: true
  - rename:
      field: json.message
      target_field: ovh_rancher.event.message
      tag: rename_event_message
      ignore_missing: true

  # --- Cleanup ---
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
