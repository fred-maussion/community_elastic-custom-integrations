    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-nodepool.yml
  ovh-managed-kubernetes-node-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
