    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-node.yml
  ovh-managed-kubernetes-audit-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
