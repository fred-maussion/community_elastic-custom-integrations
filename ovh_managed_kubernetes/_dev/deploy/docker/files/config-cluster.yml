rules:
  # OAuth2 token endpoint — used by auth.oauth2 framework during system tests
  - path: /auth/oauth2/token
    methods: [POST]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '{"access_token":"test-token","token_type":"Bearer","expires_in":3600}'
  # Cluster list — returns two synthetic cluster IDs
  - path: /cloud/project/test-project-id/kube
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '["a1b2c3d4-e5f6-7890-abcd-ef1234567890","b2c3d4e5-f6a7-8901-bcde-f12345678901"]'
  # Cluster 1 detail
  - path: /cloud/project/test-project-id/kube/a1b2c3d4-e5f6-7890-abcd-ef1234567890
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: >-
          {"id":"a1b2c3d4-e5f6-7890-abcd-ef1234567890","region":"GRA9","name":"test-cluster-1","url":"abc123.c1.gra9.k8s.ovh.net","nodesUrl":"abc123.nodes.c1.gra9.k8s.ovh.net","version":"1.32.0-1","plan":"free","nextUpgradeVersions":["1.33","1.34"],"kubeProxyMode":"iptables","customization":{"apiServer":{"admissionPlugins":{"enabled":["NodeRestriction"],"disabled":[]}},"kubeProxy":{"iptables":{},"ipvs":{}}},"status":"READY","updatePolicy":"ALWAYS_UPDATE","isUpToDate":true,"controlPlaneIsUpToDate":true,"privateNetworkId":null,"nodesSubnetId":null,"ipAllocationPolicy":{"podsIpv4Cidr":"10.2.0.0/16","servicesIpv4Cidr":"10.3.0.0/16"},"createdAt":"2026-01-15T10:00:00Z","updatedAt":"2026-01-15T10:05:00Z","auditLogsSubscribed":false}
  # Cluster 2 detail
  - path: /cloud/project/test-project-id/kube/b2c3d4e5-f6a7-8901-bcde-f12345678901
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: >-
          {"id":"b2c3d4e5-f6a7-8901-bcde-f12345678901","region":"SBG5","name":"test-cluster-2","url":"def456.c1.sbg5.k8s.ovh.net","nodesUrl":"def456.nodes.c1.sbg5.k8s.ovh.net","version":"1.31.0-1","plan":"free","nextUpgradeVersions":["1.32","1.33"],"kubeProxyMode":"iptables","customization":{"apiServer":{"admissionPlugins":{"enabled":["NodeRestriction","AlwaysPullImages"],"disabled":[]}},"kubeProxy":{"iptables":{},"ipvs":{}}},"status":"READY","updatePolicy":"ALWAYS_UPDATE","isUpToDate":false,"controlPlaneIsUpToDate":true,"privateNetworkId":null,"nodesSubnetId":null,"ipAllocationPolicy":{"podsIpv4Cidr":"10.2.0.0/16","servicesIpv4Cidr":"10.3.0.0/16"},"createdAt":"2026-01-10T08:00:00Z","updatedAt":"2026-01-14T09:00:00Z","auditLogsSubscribed":true}
