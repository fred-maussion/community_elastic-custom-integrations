---
description: Pipeline for processing OVH Managed Kubernetes node pool state events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only (Agentless metadata and error-only documents) ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: Error message set and no data to process.
  # --- end CEL-only ---

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy
        of the original message. The `event.original` field is not touched if the
        document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null

  # --- Timestamp normalization ---
  - date:
      field: json.updatedAt
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: parse_updated_at_to_timestamp
      if: ctx.json?.updatedAt != null
  - date:
      field: json.createdAt
      target_field: ovh.kubernetes.nodepool.created_at
      formats:
        - ISO8601
      tag: parse_created_at
      if: ctx.json?.createdAt != null

  # --- ECS field mapping ---
  - rename:
      field: json.cluster_id
      target_field: orchestrator.cluster.id
      tag: rename_cluster_id
      ignore_missing: true
  - rename:
      field: json.flavor
      target_field: cloud.machine.type
      tag: rename_flavor_to_cloud_machine_type
      ignore_missing: true

  # --- Static ECS fields ---
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovh
  - set:
      field: cloud.service.name
      tag: set_cloud_service_name
      value: Managed Kubernetes
  - set:
      field: orchestrator.type
      tag: set_orchestrator_type
      value: kubernetes

  # --- ECS categorization ---
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category_host
      value: host
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # --- Custom OVH fields ---
  - rename:
      field: json.id
      target_field: ovh.kubernetes.nodepool.id
      tag: rename_nodepool_id
      ignore_missing: true
  - rename:
      field: json.name
      target_field: ovh.kubernetes.nodepool.name
      tag: rename_nodepool_name
      ignore_missing: true
  - rename:
      field: json.projectId
      target_field: ovh.kubernetes.nodepool.project_id
      tag: rename_project_id
      ignore_missing: true
  - rename:
      field: json.status
      target_field: ovh.kubernetes.nodepool.status
      tag: rename_status
      ignore_missing: true
  - rename:
      field: json.sizeStatus
      target_field: ovh.kubernetes.nodepool.size_status
      tag: rename_size_status
      ignore_missing: true
  - rename:
      field: json.autoscale
      target_field: ovh.kubernetes.nodepool.autoscale
      tag: rename_autoscale
      ignore_missing: true
  - rename:
      field: json.monthlyBilled
      target_field: ovh.kubernetes.nodepool.monthly_billed
      tag: rename_monthly_billed
      ignore_missing: true
  - rename:
      field: json.antiAffinity
      target_field: ovh.kubernetes.nodepool.anti_affinity
      tag: rename_anti_affinity
      ignore_missing: true
  - rename:
      field: json.desiredNodes
      target_field: ovh.kubernetes.nodepool.desired_nodes
      tag: rename_desired_nodes
      ignore_missing: true
  - rename:
      field: json.minNodes
      target_field: ovh.kubernetes.nodepool.min_nodes
      tag: rename_min_nodes
      ignore_missing: true
  - rename:
      field: json.maxNodes
      target_field: ovh.kubernetes.nodepool.max_nodes
      tag: rename_max_nodes
      ignore_missing: true
  - rename:
      field: json.currentNodes
      target_field: ovh.kubernetes.nodepool.current_nodes
      tag: rename_current_nodes
      ignore_missing: true
  - rename:
      field: json.availableNodes
      target_field: ovh.kubernetes.nodepool.available_nodes
      tag: rename_available_nodes
      ignore_missing: true
  - rename:
      field: json.upToDateNodes
      target_field: ovh.kubernetes.nodepool.up_to_date_nodes
      tag: rename_up_to_date_nodes
      ignore_missing: true
  - rename:
      field: json.autoscaling.scaleDownUtilizationThreshold
      target_field: ovh.kubernetes.nodepool.autoscaling.scale_down_utilization_threshold
      tag: rename_scale_down_utilization_threshold
      ignore_missing: true
  - rename:
      field: json.autoscaling.scaleDownUnneededTimeSeconds
      target_field: ovh.kubernetes.nodepool.autoscaling.scale_down_unneeded_time_seconds
      tag: rename_scale_down_unneeded_time_seconds
      ignore_missing: true
  - rename:
      field: json.autoscaling.scaleDownUnreadyTimeSeconds
      target_field: ovh.kubernetes.nodepool.autoscaling.scale_down_unready_time_seconds
      tag: rename_scale_down_unready_time_seconds
      ignore_missing: true

  # --- Cleanup (removes json including template sub-object) ---
  - remove:
      field: json
      tag: remove_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
