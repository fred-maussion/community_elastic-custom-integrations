---
description: Pipeline for processing OVH Managed Kubernetes audit events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # CEL input only — remove Agentless metadata fields
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  # message → event.original
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: >-
        Renames the original `message` field to `event.original` to store a copy of the
        original message. The `event.original` field is not touched if the document already
        has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # Parse Graylog JSON envelope from event.original
  # Each event is a Graylog message object: {_id, timestamp, level, message}
  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_json: {{{ _ingest.on_failure_message }}}'

  # Timestamp from Graylog envelope
  - date:
      field: json.timestamp
      target_field: '@timestamp'
      formats:
        - strict_date_optional_time
      tag: parse_timestamp
      if: ctx.json?.timestamp != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_timestamp: {{{ _ingest.on_failure_message }}}'

  # Parse the compact audit text: "{verb} {allow|deny} {status}  {uri}  [{rest} ]{audit-uuid}"
  # Double-space is the field delimiter; trailing UUID is always the audit ID.
  - grok:
      field: json.message
      tag: grok_audit_message
      patterns:
        - '^%{WORD:_tmp_verb} %{WORD:_tmp_outcome} %{INT:_tmp_status_code}  %{DATA:_tmp_uri}  (?:%{DATA:_tmp_rest} )?(?<_tmp_audit_id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'grok_audit_message: {{{ _ingest.on_failure_message }}}'

  # ECS field mappings from parsed grok fields
  - rename:
      field: _tmp_verb
      target_field: event.action
      tag: rename_verb
      ignore_missing: true
  - rename:
      field: _tmp_uri
      target_field: url.original
      tag: rename_uri
      ignore_missing: true
  - rename:
      field: _tmp_audit_id
      target_field: event.id
      tag: rename_audit_id
      ignore_missing: true
  - convert:
      field: _tmp_status_code
      target_field: http.response.status_code
      type: integer
      tag: convert_status_code
      ignore_missing: true
      on_failure:
        - append:
            field: error.message
            value: 'convert_status_code: {{{ _ingest.on_failure_message }}}'

  # event.outcome: allow → success, deny → failure
  - set:
      field: event.outcome
      tag: set_event_outcome_success
      value: success
      if: ctx._tmp_outcome == "allow"
  - set:
      field: event.outcome
      tag: set_event_outcome_failure
      value: failure
      if: ctx._tmp_outcome == "deny"

  # Store Graylog message ID and severity
  - rename:
      field: json._id
      target_field: ovh.kubernetes.audit.log_id
      tag: rename_log_id
      ignore_missing: true
  - rename:
      field: json.level
      target_field: ovh.kubernetes.audit.level
      tag: rename_level
      ignore_missing: true
  - rename:
      field: json.message
      target_field: ovh.kubernetes.audit.message
      tag: rename_raw_message
      ignore_missing: true

  # Static cloud and orchestrator fields
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovh
  - set:
      field: cloud.service.name
      tag: set_cloud_service_name
      value: Managed Kubernetes
  - set:
      field: orchestrator.type
      tag: set_orchestrator_type
      value: kubernetes

  # ECS categorization
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category_api
      value: api
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_access
      value: access
      allow_duplicates: false

  # Cleanup
  - remove:
      field:
        - json
        - _tmp_verb
        - _tmp_outcome
        - _tmp_status_code
        - _tmp_rest
        - _tmp_audit_id
      tag: cleanup_tmp
      ignore_missing: true

  # Tag document for triage when collector-level errors occurred
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
