wait_for_data_timeout: 1m
input: cel
service: ovh-managed-kubernetes-audit-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  service_name: test-project-id
  client_id: test-client-id
  client_secret: test-client-secret
  token_url: http://{{Hostname}}:{{Port}}/auth/oauth2/token
data_stream:
  vars:
    kube_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    interval: 10s
    preserve_original_event: true
assert:
  # Round 1: 3 events pass the cursor filter (no cursor on first run).
  # Round 2: 0 new events (all stageTimestamps <= cursor.last_timestamp).
  # Note: requires a Standard plan OVHcloud Managed Kubernetes cluster with audit logs enabled.
  hit_count: 3
