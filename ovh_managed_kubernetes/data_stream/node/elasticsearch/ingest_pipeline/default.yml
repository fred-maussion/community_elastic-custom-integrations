---
description: Pipeline for processing OVH Managed Kubernetes node events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  # --- end CEL-only ---

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null

  # Date normalization
  - date:
      field: json.updatedAt
      tag: parse_timestamp
      target_field: '@timestamp'
      formats:
        - ISO8601
      if: ctx.json?.updatedAt != null
  - date:
      field: json.createdAt
      tag: parse_created_at
      target_field: ovh.kubernetes.node.created_at
      formats:
        - ISO8601
      if: ctx.json?.createdAt != null
  - date:
      field: json.deployedAt
      tag: parse_deployed_at
      target_field: ovh.kubernetes.node.deployed_at
      formats:
        - ISO8601
      if: ctx.json?.deployedAt != null
      on_failure:
        - append:
            field: error.message
            value: >-
              Processor {{{_ingest.on_failure_processor_type}}}
              with tag '{{{_ingest.on_failure_processor_tag}}}'
              failed: {{{_ingest.on_failure_message}}}

  # ECS field renames
  - rename:
      field: json.cluster_id
      tag: rename_cluster_id
      target_field: orchestrator.cluster.id
      ignore_missing: true
  - rename:
      field: json.name
      tag: rename_name
      target_field: host.name
      ignore_missing: true
  - rename:
      field: json.instanceId
      tag: rename_instance_id
      target_field: cloud.instance.id
      ignore_missing: true
  - rename:
      field: json.flavor
      tag: rename_flavor
      target_field: cloud.machine.type
      ignore_missing: true

  # Static ECS fields
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovh
  - set:
      field: cloud.service.name
      tag: set_cloud_service_name
      value: Managed Kubernetes
  - set:
      field: orchestrator.type
      tag: set_orchestrator_type
      value: kubernetes

  # ECS categorization (Pattern B — 3 static mappings)
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category_host
      value: host
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # Custom OVH field renames
  - rename:
      field: json.id
      tag: rename_node_id
      target_field: ovh.kubernetes.node.id
      ignore_missing: true
  - rename:
      field: json.nodePoolId
      tag: rename_node_pool_id
      target_field: ovh.kubernetes.node.node_pool_id
      ignore_missing: true
  - rename:
      field: json.projectId
      tag: rename_project_id
      target_field: ovh.kubernetes.node.project_id
      ignore_missing: true
  - rename:
      field: json.status
      tag: rename_status
      target_field: ovh.kubernetes.node.status
      ignore_missing: true
  - rename:
      field: json.isUpToDate
      tag: rename_is_up_to_date
      target_field: ovh.kubernetes.node.is_up_to_date
      ignore_missing: true
  - rename:
      field: json.version
      tag: rename_version
      target_field: ovh.kubernetes.node.version
      ignore_missing: true

  # Cleanup
  - remove:
      field: json
      tag: cleanup_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
