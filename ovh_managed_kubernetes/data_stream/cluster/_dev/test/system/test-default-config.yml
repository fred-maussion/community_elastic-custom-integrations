wait_for_data_timeout: 1m
input: cel
service: ovh-managed-kubernetes-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  service_name: test-project-id
  client_id: test-client-id
  client_secret: test-client-secret
  token_url: http://{{Hostname}}:{{Port}}/auth/oauth2/token
data_stream:
  vars:
    interval: 10s
    preserve_original_event: true
assert:
  hit_count: 2
