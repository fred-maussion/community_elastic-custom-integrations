---
description: Pipeline for processing OVHcloud account profile events.
processors:
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags

  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null

  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      on_failure:
        - append:
            field: error.message
            value: 'parse_json: {{{ _ingest.on_failure_message }}}'

  # ECS boilerplate
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category_iam
      value: iam
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false
  - set:
      field: cloud.provider
      tag: set_cloud_provider
      value: ovh

  # ECS user fields — user.name and user.email map directly
  - rename:
      field: json.nichandle
      target_field: user.name
      tag: rename_nichandle_to_user_name
      ignore_missing: true
  - rename:
      field: json.email
      target_field: user.email
      tag: rename_email
      ignore_missing: true
  - set:
      field: user.full_name
      tag: set_user_full_name
      value: '{{{json.firstname}}} {{{json.name}}}'
      if: ctx.json?.firstname != null && ctx.json?.name != null

  # OVH-specific account fields
  - rename:
      field: json.firstname
      target_field: ovh.billing.account.firstname
      tag: rename_firstname
      ignore_missing: true
  - rename:
      field: json.name
      target_field: ovh.billing.account.name
      tag: rename_name
      ignore_missing: true
  - rename:
      field: json.phone
      target_field: ovh.billing.account.phone
      tag: rename_phone
      ignore_missing: true
  - rename:
      field: json.country
      target_field: ovh.billing.account.country
      tag: rename_country
      ignore_missing: true
  - rename:
      field: json.language
      target_field: ovh.billing.account.language
      tag: rename_language
      ignore_missing: true
  - rename:
      field: json.state
      target_field: ovh.billing.account.state
      tag: rename_state
      ignore_missing: true
  - rename:
      field: json.ovhSubsidiary
      target_field: ovh.billing.account.ovh_subsidiary
      tag: rename_ovh_subsidiary
      ignore_missing: true
  - rename:
      field: json.legalform
      target_field: ovh.billing.account.legal_form
      tag: rename_legalform
      ignore_missing: true
  - rename:
      field: json.organisation
      target_field: ovh.billing.account.organisation
      tag: rename_organisation
      ignore_missing: true
  - set:
      field: ovh.billing.account.currency_code
      tag: set_currency_code
      copy_from: json.currency.code
      ignore_empty_value: true
      if: ctx.json?.currency?.code != null

  # Cleanup
  - remove:
      field: json
      tag: cleanup_json
      ignore_missing: true

  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      tag: on_failure_append_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: on_failure_append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
