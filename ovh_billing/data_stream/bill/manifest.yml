title: "OVHcloud Bills"
type: logs
streams:
  - input: cel
    title: OVHcloud bill history
    description: Collect OVHcloud invoice and bill history.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Collection Interval
        description: How often to poll for new bills (e.g. 1h, 6h, 24h).
        default: 6h
        show_user: true
        required: true
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracing
        description: Enables request tracing for the CEL input. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details. This is meant for debugging only and should be disabled in production.
        multi: false
        required: false
        show_user: false
      - name: proxy_url
        type: text
        title: Proxy URL
        multi: false
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL Configuration
        multi: false
        required: false
        show_user: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out (e.g. 60s).
        multi: false
        required: false
        show_user: false
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - ovh_billing-bill
