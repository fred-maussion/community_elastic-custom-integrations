rules:
  # OAuth2 token endpoint
  - path: /auth/oauth2/token
    methods: [POST]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '{"access_token":"test-token","token_type":"Bearer","expires_in":3600}'
  # GET /me — account profile
  - path: /me
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '{"nichandle":"example-acct-ovh","firstname":"Example","name":"Account","email":"example-account@example.com","phone":"+33100000000","country":"FR","currency":{"code":"EUR","symbol":"€"},"language":"fr_FR","legalform":"individual","state":"complete","ovhSubsidiary":"FR","phoneCountry":"FR"}'
  # GET /me/bill — list of bill IDs (2 bills to keep test fast)
  - path: /me/bill
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '["LF20000001","LF20000002"]'
  # GET /me/bill/LF20000001/details — line item IDs
  - path: /me/bill/LF20000001/details
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '["FR10000001","FR10000002"]'
  # GET /me/bill/LF20000002/details
  - path: /me/bill/LF20000002/details
    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '["FR20000001","FR20000002"]'
  # GET /me/bill/LF20000001/details/FR10000001
