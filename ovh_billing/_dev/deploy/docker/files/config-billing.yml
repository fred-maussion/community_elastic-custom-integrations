    methods: [GET]
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - application/json
        body: '{"billDetailId":"FR10000001","description":"Public Cloud Gateway Small","domain":"abcdef1234567890abcdef1234567890","quantity":"720","periodStart":"2026-05-01","periodEnd":"2026-06-01","totalPrice":{"value":2.02,"currencyCode":"EUR","text":"2.02 €"},"unitPrice":{"value":0.0028,"currencyCode":"EUR","text":"0.0028 €"}}'
  # GET /me/bill/LF20000001/details/FR10000002
