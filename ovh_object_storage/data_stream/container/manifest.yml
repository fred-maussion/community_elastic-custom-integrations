title: "OVHcloud Object Storage Container"
type: logs
streams:
  - input: cel
    title: "Collect OVHcloud Object Storage container data via API"
    description: |-
      Collect container inventory, configuration, encryption, versioning, and replication state via the OVHcloud REST API
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: "Polling Interval"
        description: |-
          How often the API is polled. Supports seconds, minutes, and hours.
        required: true
        show_user: true
        default: 5m
      - name: enable_request_tracer
        type: bool
        title: "Enable request tracing"
        description: |-
          The request tracer logs HTTP requests and responses to the agent's local file-system for debugging. Enabling this compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        default: false
      - name: http_client_timeout
        type: text
        title: "HTTP Client Timeout"
        description: |-
          Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h. Example: 30s.
        show_user: false
      - name: proxy_url
        type: url
        title: "Proxy URL"
        description: |-
          HTTP/HTTPS proxy URL for the integration. Format: http[s]://<user>:<password>@<host>:<port>.
        show_user: false
      - name: ssl
        type: yaml
        title: "TLS Configuration"
        description: |-
          Custom TLS settings (certificate_authorities, supported_protocols, verification_mode, etc.). See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html) for details.
        show_user: false
        multi: false
      - name: tags
        type: text
        title: "Tags"
        description: |-
          Tags to add to each event.
        multi: true
        show_user: true
        default:
          - forwarded
      - name: preserve_original_event
        type: bool
        title: "Preserve original event"
        description: |-
          Preserves a raw copy of the original event, added to the field `event.original`.
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: "Processors"
        description: |-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false
